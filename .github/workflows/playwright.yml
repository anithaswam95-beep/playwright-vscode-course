name: Playwright Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: demo/package-lock.json
      - name: Install dependencies
        working-directory: demo
        run: npm ci
      - name: Install Playwright browsers
        working-directory: demo
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        working-directory: demo
        run: npx playwright test
      - name: Annotate failed tests
        if: failure()
        working-directory: demo
        run: |
          python3 - <<'PY'
          import re, sys
          import xml.etree.ElementTree as ET
          try:
              root = ET.parse('results/junit.xml').getroot()
          except Exception as e:
              print(f"::error::Could not read junit.xml: {e}")
              sys.exit(0)
          clean = lambda s: re.sub(r'\x1b\[[0-9;]*m', '', s or '')
          found = False
          for tc in root.iter('testcase'):
              for f in tc:
                  if f.tag in ('failure', 'error'):
                      found = True
                      msg = clean(f.get('message')).splitlines()[0][:250]
                      print(f"::error title=Playwright failure::{tc.get('classname')} > {tc.get('name')} :: {msg}")
          if not found:
              print("::error::Playwright exited non-zero but junit.xml reports no failed tests (check config/list errors above this step)")
          PY
      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        if: '!cancelled()'
        with:
          name: playwright-report
          path: demo/playwright-report/
          retention-days: 30
          if-no-files-found: warn
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: |
            demo/test-results/
            demo/results/junit.xml
          retention-days: 30
          if-no-files-found: warn


